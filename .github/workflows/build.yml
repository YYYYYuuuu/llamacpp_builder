name: Build llama.cpp (Windows / CUDA / MSVC)

# ---------------------------------------------------------------------------
# 构建步骤严格对齐官方：
#   1) 构建命令  -> 官方文档 docs/build.md：
#        cmake -B build -DGGML_CUDA=ON
#        cmake --build build --config Release
#     并叠加文档里列出的两个可选覆盖项：
#        -DGGML_NATIVE=OFF                (文档 "Overriding all CUDA GPUs")
#        -DCMAKE_CUDA_ARCHITECTURES="..." (文档 "Overriding the compute capability")
#   2) MSVC 环境 -> 官方 .github/workflows/release.yml 的 windows-cuda job：
#        call "...\VC\Auxiliary\Build\vcvarsall.bat" x64
#     官方要求"必须在 Developer Command Prompt / PowerShell for VS2022 里执行"，
#     在 runner 上用 vcvarsall 是等价做法，官方自己也是这么写的。
#   3) CUDA 安装 -> 官方 .github/actions/windows-setup-cuda 的机制：
#        NVIDIA redist 独立组件包 -> unzip -> xcopy 合并 -> 加入 PATH
#   4) 架构取值 -> ggml/src/ggml-cuda/CMakeLists.txt：
#        120a-real 仅在 CUDAToolkit >= 12.8 时加入；裸 12X 会被自动改写成 12Xa
#
# 唯一的非官方改动：
#   官方 windows-setup-cuda 只内置 11.7 / 12.4 / 13.1 / 13.4 四个版本分支，没有 12.8。
#   这里沿用官方完全相同的 redist 拼装方式，只把版本号换成 12.8（另附 12.9 备选）。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "llama.cpp 的 git ref。填 b 开头的滚动构建 tag（如 b11177）。别填 v0.5.0 —— 那是空标记 release，只有一个 nightly-tag.txt，没有二进制"
        required: false
        default: "b11177"
      cuda_version:
        description: "CUDA Toolkit 版本（RTX 50 系需要 12.8+ 才有 sm_120）"
        required: false
        default: "12.8"
      cuda_archs:
        description: "CMAKE_CUDA_ARCHITECTURES（RTX 5090 = 120a）"
        required: false
        default: "120a"

permissions:
  contents: read

env:
  CUDA_VERSION: ${{ github.event.inputs.cuda_version || '12.8' }}

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.ref || 'b11177' }}
          fetch-depth: 1

      # 官方 action 缺 12.8，这里按官方同样方式（redist 组件包 + xcopy 合并）补齐
      - name: Install CUDA Toolkit
        shell: pwsh
        run: |
          $ver = $env:CUDA_VERSION
          $dest = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$ver"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          choco install unzip -y
          choco install ninja -y
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $pkgs = switch ($ver) {
            "12.8" {
              "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.8.90-archive.zip"
              "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.8.93-archive.zip"
              "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.8.93-archive.zip"
              "libcublas/windows-x86_64/libcublas-windows-x86_64-12.8.4.1-archive.zip"
              "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-12.8.90-archive.zip"
              "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-12.8.90-archive.zip"
              "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-12.8.90-archive.zip"
              "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.8.90-archive.zip"
            }
            "12.9" {
              "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.9.79-archive.zip"
              "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.9.86-archive.zip"
              "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.9.86-archive.zip"
              "libcublas/windows-x86_64/libcublas-windows-x86_64-12.9.1.4-archive.zip"
              "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-12.9.79-archive.zip"
              "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-12.9.79-archive.zip"
              "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-12.9.79-archive.zip"
              "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.9.79-archive.zip"
            }
            default { throw "本 workflow 未内置 $ver 的 redist 清单，请填 12.8 或 12.9" }
          }
          foreach ($p in $pkgs) { curl.exe -sS -O "$base/$p" }
          unzip -q '*.zip' -d $dest
          Get-ChildItem "$dest\*-archive" -Directory | ForEach-Object {
            xcopy "$($_.FullName)\*" "$dest" /E /I /H /Y | Out-Null
          }
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify nvcc
        shell: pwsh
        run: nvcc --version

      # 兜底：把 CUDA 的 MSBuild 集成文件放进 VS。
      # 使用 Visual Studio 生成器时必须有它，否则 enable_language(CUDA) 报 "No CUDA toolset found"。
      # 我们主用 Ninja（不需要它），但装上可以顺便兼容 VS 生成器。
      - name: Install CUDA MSBuild integration (safety net)
        shell: pwsh
        run: |
          $src = "$env:CUDA_PATH\visual_studio_integration\MSBuildExtensions"
          $dst = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          if ((Test-Path $src) -and (Test-Path $dst)) {
            Copy-Item "$src\*" $dst -Force
            Get-ChildItem $dst -Filter "*12.8*" | Select-Object -ExpandProperty Name
          } else {
            Write-Host "跳过：src=$src 或 dst=$dst 不存在（Ninja 生成器不依赖它）"
          }

      # 官方要求：加载 MSVC 环境变量（等价于 Developer Command Prompt）
      # 关键：用 Ninja Multi-Config，和官方 release.yml 的 windows-cuda job 完全一致。
      # 默认的 Visual Studio 生成器会去 MSBuild 找 CUDA toolset，redist 拼装的 toolkit 没注册就会失败。
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -B build -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES="${{ github.event.inputs.cuda_archs || '120a' }}"

      - name: Show resolved CUDA architectures
        shell: cmd
        run: findstr /I "CUDA_ARCHITECTURES" build\CMakeCache.txt

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%

      # runner 无 GPU，但 cuobjdump 仍可确认 fatbin 里含 sm_120a cubin
      - name: Verify sm_120a in ggml-cuda.dll
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:CUDA_PATH\bin\cuobjdump.exe" -res-usage build\bin\Release\ggml-cuda.dll |
            Select-String -Pattern "arch =" |
            Select-Object -Unique

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\bin\Release\*.exe out\
          Copy-Item build\bin\Release\*.dll out\
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" out\
          Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" out\
          Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" out\
          Get-ChildItem out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Compress-Archive -Path out\* -DestinationPath llama-win-cuda${{ env.CUDA_VERSION }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-win-cuda${{ env.CUDA_VERSION }}
          path: llama-win-cuda${{ env.CUDA_VERSION }}.zip
          retention-days: 90
